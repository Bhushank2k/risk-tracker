name: Free Telegram Intraday Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud-scanner/**"
      - "scanner-core/**"
      - ".github/workflows/free-telegram-intraday-scanner.yml"

permissions:
  contents: read

concurrency:
  group: free-telegram-intraday-scanner
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test scanner and build it
        run: gradle :scanner-core:test :cloud-scanner:test :cloud-scanner:installDist --no-daemon

      - name: Probe Kraken public market-data access from GitHub runner
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="https://futures.kraken.com/derivatives/api/v3"
          charts="https://futures.kraken.com/api/charts/v1"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --silent --show-error --max-time 20 "$base/instruments" -o "$tmp/instruments.json"
          jq -e '.result == "success" and (.instruments | length > 0)' "$tmp/instruments.json" >/dev/null
          echo "Kraken instruments: OK"

          curl --fail --silent --show-error --max-time 20 "$base/tickers" -o "$tmp/tickers.json"
          jq -e '.result == "success" and (.tickers | length > 0)' "$tmp/tickers.json" >/dev/null
          echo "Kraken tickers: OK"

          curl --fail --silent --show-error --max-time 20 "$base/orderbook?symbol=PF_XBTUSD" -o "$tmp/orderbook.json"
          jq -e '.result == "success" and (.orderBook.bids | length > 0) and (.orderBook.asks | length > 0)' "$tmp/orderbook.json" >/dev/null
          echo "Kraken futures order book: OK"

          curl --fail --silent --show-error --max-time 20 "$charts/trade/PF_XBTUSD/1h?count=3" -o "$tmp/candles.json"
          jq -e '(.candles | length > 0)' "$tmp/candles.json" >/dev/null
          echo "Kraken futures candles: OK"

      - name: Scan markets and send READY alerts to Telegram
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./cloud-scanner/build/install/cloud-scanner/bin/cloud-scanner
