name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/android-apk-build, fix/android-apk-build]
    paths:
      - 'android/**'
      - 'index.html'
      - 'logo.svg'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Package web app assets
        run: |
          test -s index.html
          test -s logo.svg
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp logo.svg android/app/src/main/assets/logo.svg
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify APK and bundled assets
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/(index.html|logo.svg)'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: risk-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
